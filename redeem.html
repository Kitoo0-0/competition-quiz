<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>兑换测试｜竞势</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">势</span>竞势</a>
      <div class="header-actions"><a class="text-link" href="index.html">返回首页</a></div>
    </div>
  </header>

  <main class="center-page">
    <div class="container" style="display:grid;place-items:center">
      <section class="panel redeem-panel">
        <div class="eyebrow">Access pass</div>
        <h1 class="page-title">兑换一次完整测试</h1>
        <p class="page-copy">正式上线后，每个兑换码只绑定一个测试会话。当前前端预览使用演示兑换码，不会连接真实数据库。</p>
        <label class="field-label" for="code">兑换码</label>
        <input id="code" class="code-input" placeholder="XXXX-XXXX" autocomplete="off">
        <button id="redeemBtn" class="btn btn-primary btn-full" style="margin-top:12px">验证兑换码</button>
        <div id="alert" class="alert"></div>
        <div class="hint">前端演示码：<code>DEMO-2026</code></div>
      </section>
    </div>
  </main>

  <script>
    const input = document.getElementById('code');
    const button = document.getElementById('redeemBtn');
    const alertBox = document.getElementById('alert');
    function showAlert(text, type) {
      alertBox.textContent = text;
      alertBox.className = `alert show ${type}`;
    }
    function redeem() {
      const code = input.value.trim().toUpperCase();
      if (code !== 'DEMO-2026') {
        showAlert('兑换码无效。前端预览请使用 DEMO-2026。', 'error');
        return;
      }
      localStorage.setItem('competition_quiz_code', code);
      showAlert('验证成功，正在进入测试。', 'success');
      setTimeout(() => location.href = 'quiz.html', 350);
    }
    button.addEventListener('click', redeem);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') redeem(); });
  </script>
</body>
</html>
